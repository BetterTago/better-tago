      - 1. Registration of births for on-time and delayed report, occurred at home, or in clinic.
      - >-
        Registration of Birth Certificate is a basic act to report the occurrence of birth of a
        child/person for registration in the Local Civil Registry Office where the birth
      - >-
        occurred. The Certificate of Live Birth is a proof of person’s existence and establish
        identity.
      - >-
        On-time registration is reporting of birth within thirty (30) days from the time of birth in
        the Office of the Local Civil Registrar of the city/municipality where the
      - birth occurred.
      - >-
        Delayed registration is reporting of birth beyond thirty (30) days period to the Office of
        the Local Civil Registrar of the city/municipality where the birth occurred.

    text:
      - >-
        2. Registration of Certificate of Marriage (COM) for on-time and delayed report, occurred in
        Tago, Surigao del Sur.
      - >-
        Registration of Certificate of Marriage (COM) is a reporting of the Certificate of Marriage
        after the wedding day to the Local Civil Registrar’s office and become
      - a proof of a person’s civil status and the existence of marriage.
      - >-
        In ordinary marriage, the time for submission of the Certificate of Marriage is within
        fifteen (15) days following the solemnization of marriage while in marriage
      - >-
        exempt from license requirement, the prescribed period is thirty(30) days, at the place
        where the marriage was solemnized.

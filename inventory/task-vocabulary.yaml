glossary:
  note: >-
    Recurring terms as the charter writes them, for use INSIDE a page. Counts are occurrences across
    the external services. This is a glossary of what recurs, not an exhaustive transcription — the
    full requirement and fee text belongs to the transcription work, not to this vocabulary.
  documents:
    - verbatim: Barangay Certificate of Indigency
      occurrences: 7
    - verbatim: Certificate of Indigency
      occurrences: 2
    - verbatim: Proof of Identification
      occurrences: 6
    - verbatim: Official Receipt
      occurrences: 6
    - verbatim: Authorization Letter or SPA
      occurrences: 3
    - verbatim: Barangay Clearance
      occurrences: 2
    - verbatim: Police Clearance
      occurrences: 2
    - verbatim: NBI Clearance
      occurrences: 2
    - verbatim: Police Report
      occurrences: 2
    - verbatim: Community Tax Certificate.
      occurrences: 2
      note: The trailing full stop is the document’s.
    - verbatim: Community Tax or Cedula (xerox copy)
      occurrences: 2
    - verbatim: Individual Treatment Record
      occurrences: 4
      note: Also printed “Individual treatment Record”.
    - verbatim: PSA’s Request Form (Certificate of Live Birth)
      occurrences: 4
    - verbatim: PSA’s Request Form (Birth/Marriage/Death Certificate)
      occurrences: 2
    - verbatim: PSA copy(blurred) or PSA Negative Certification
      occurrences: 2
      note: Printed without a space before the bracket.
    - verbatim: Certificate of Live Birth sought to be corrected
      occurrences: 3
    - verbatim: Birth/Marriage/Death Certificate sought to be corrected
      occurrences: 2
    - verbatim: Child’s Certificate of Live Birth
      occurrences: 2
    - verbatim: Duly accomplished death certificate
      occurrences: 2
    - verbatim: Sanitary Permit (original copy)
      occurrences: 2
    - verbatim: Realty Tax Clearance (including back taxes)
      occurrences: 1
      note: Also printed “Realty Property Tax Clearance (including back taxes)”.
    - verbatim: Latest Tax Declaration
      occurrences: 1
  fees:
    - verbatim: Application Filling fee
      note: The charter’s own spelling. Recorded as published — not corrected to “Filing”.
    - verbatim: Ground Preparation and Excavation Fee
    - verbatim: 'Fencing Fees:'
    - verbatim: Plumbing Fee
    - verbatim: Electronics Fee
    - verbatim: Accessory Fees
    - verbatim: Accessories of the Building/Structures Fees
    - verbatim: Moving Fee, per sq. meter of area of building/structure to be moved
    - verbatim: Sultadas fee
    - verbatim: 'Laboratory Fees :'
      note: Spaced before the colon in the document.
    - verbatim: JRS/LBC (Private Courier) 250.00 fee to PSA Regional Office
      note: Also printed “JRS/LBC (Private courier)” and “JRS/LBC private courier”.
  claimants:
    - verbatim: Person Principal to the Transaction
      occurrences: 5
    - verbatim: Authorized Representative
      occurrences: 5

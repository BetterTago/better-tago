groups:
  - id: register-a-death
    question: How do I register a death?
    members:
      - office-of-the-municipal-civil-registrar#external-3
      - office-of-the-municipal-civil-registrar#external-4
    note: >-
      Two charter entries, and the charter does not say what separates them. Both are kept: merging
      them would mean choosing one set of requirements for a resident and hiding the other.
  - id: electronic-endorsement
    question: How do I get a civil registry record endorsed electronically?
    members:
      - office-of-the-municipal-civil-registrar#external-6
      - office-of-the-municipal-civil-registrar#external-7
    note: >-
      The second entry adds certifications and certified copies. Different requirements, so they
      stay separate records.
  - id: patient-transfer
    question: How do I get a patient transferred?
    members:
      - office-of-the-municipal-disaster-risk-reduction-management#external-2
      - office-of-the-municipal-disaster-risk-reduction-management#external-5
    note: >-
      One entry covers transfer out of Tago, the other transfer between facilities. A caller in an
      emergency asks one question; the charter answers it twice.
  - id: medical-certificate
    question: How do I get a medical certificate?
    members:
      - municipal-health-office#external-10
      - municipal-health-office#external-11
    note: The medico-legal certificate has its own requirements and its own processing time.
  - id: business-permit
    question: How do I get or renew a business permit?
    members:
      - business-licensing-and-permitting-division-external-services#external-2
      - business-licensing-and-permitting-division-external-services#external-3
      - tourism-external-services#external-1
    note: >-
      Two offices answer this. A tourism establishment is served by the Tourism Office; every other
      business by the licensing division. A resident does not know that in advance, which is the
      whole reason for the group.

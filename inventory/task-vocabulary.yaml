# The resident-task title vocabulary — AUTHORED BY HAND, not generated.
#
# `npm run harvest` does NOT write this file and will not overwrite it. It is
# the mapping from each enumerated charter service to the title it is published
# under, plus the office roster and the verbatim terms pages must use.
#
# The rules behind it are in docs/task-titles.md. src/lib/task-vocabulary.test.ts
# enforces the ones that can be enforced.
#
# Nothing here is published. It is a work list.

namingRules:
  spelling: >-
    Resident-facing titles use the spelling residents use here — organization, immunized,
    counseling, license. The rest of this repository’s prose is British; titles are not prose.
  imperativeVerbs:
    - Add
    - Apply
    - Attend
    - Cancel
    - Change
    - Claim
    - Close
    - Correct
    - Declare
    - Get
    - Have
    - Join
    - Pay
    - Reclassify
    - Register
    - Renew
    - Request
    - See
    - Submit
    - Transfer
    - Use
    - Visit
  residentAcronyms:
    PSA: >-
      The Philippine Statistics Authority. People ask for “a PSA birth certificate” by that name and
      rarely by the full one.
    DOT: The Department of Tourism. An establishment seeking accreditation knows it as DOT.
    DOLE: The Department of Labor and Employment. Widely used in speech.
    NGO: In ordinary use in the Philippines, including by the organisations themselves.
    HIV: Universally used; the expansion would make the title harder to scan, not easier.
  forbiddenInTitles:
    - office
    - division
    - bureau
    - department
    - unit
    - sangguniang
    - municipal
    - municipality
    - enro
    - peso
    - peeso
    - mswdo
    - mdrrmo
    - meo
  roleExceptions:
    Mayor: >-
      “Mayor’s permit” and “mayor’s certificate” are what the documents are called and what
      residents ask for. The ROLE is permitted in a title; “Mayor’s Office” is not.
    Vice Mayor: >-
      Same reasoning — the letter goes to the office-holder, and a resident asks for the Vice Mayor
      by role.

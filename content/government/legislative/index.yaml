      eligibility: Individuals, Private Organizations, NGOs, and Other G overnment Agencies
      classification: Simple
      typeOfTransaction: G2C – Government to Citizen
      requirements:
        - item: Accreditation of Non-Governmental Organizations (NGO’s) and People’s Organization (PO’s)
          marked: false
          whereToSecure: NGOs, POs, Private Sectors
        - item: '1. INQUIRE FOR ACCREDITATION ORGANIZATIONS REQUIREMENTS:'
          marked: true
          whereToSecure: OF
      requirementSources: []
      steps:
        - clientStep: >-
            1. Duly accomplish Application Form for Accreditation; 2. Board Resolution; 3.
            Certificate of Registration issued by __________; 4. List of Current Officers and
            Members; 5. Original Sworn Statement stating that the CSO is an independent,
            non-partisan organization and that it will retain its autonomy while pursuing the
            advancement of the peoples’ interest through its membership in a local special body,
            after satisfying all the requirements and set criteria, as stated in DILG Memorandum
            Circular No. _______ dated, and after securing a Certification of Accreditation form the
            concerned Sanggunian; 6. CY Annual Accomplishment Report; 7. CY Financial Statement; 8.
            Profile indicating the purposes and objectives of our organization; 9. Copy of the
            Minutes of the CY ___________ Meeting of the Organization; and 10. For CSOs applying to
            be members of the Local School or Health Board: Photocopy of profiles of at least three
            (3) individuals in the organization that will verify their involvement in the health or
            education sector.
          agencyAction: Explain to the client the requirements and give application form
          fee: None
          processingTime: 2‐5 minutes
          personResponsible: Local Legislative Staff Officer V
        - clientStep: 2. SUBMISSION OF APPLICATION AND REQUIREMENTS

# Treasury and revenue services — property assessment, accounting and budget — index-and-link only.
#
# Each entry names a service, says which office provides it, and links the
# Citizen's Charter document that defines it. NO fee, requirement, processing
# time or other charter figure is published here: republishing the charter
# contents is a permission this project has not sought, and the index is the
# part residents were actually missing.
#
# Titles, slugs, offices, groups and ambiguities are joined from
# inventory/task-vocabulary.yaml by charterServiceId. Do not re-derive one.
#
# ⚠️ The Office of the Municipal Treasurer is NOT in here, and that is the finding rather
# than an omission: its charter document publishes ONE service and that service is
# internal — government-to-government — so there is no real property tax page, no
# community tax certificate and no schedule of fees and charges to index. The
# revenue-side work a resident actually transacts is the assessor's. See inventory/README.md.

            Purisima, Tago Surigao del sur
        - item: >-
            - Electrical Permit (2 copies) (originally signed and sealed by duly licensed and
            registered Professional Electrical Engineer) - Mechanical Permit (2 copies) (originally
            signed and sealed by duly licensed and registered Professional Mechanical Engineer)
          marked: true
          whereToSecure: null
        - item: >-
            - Sanitary/Plumbing Permit - (2 copies) (originally signed and sealed by duly licensed
            and registered Sanitary Engineer/ Master Plumber) - Electronics Permit (2 copies)
            (originally signed and sealed by duly licensed and registered Electronics Communication
            Engineer) Note: All permit forms must be filled-up completely and must be signed by the
            professionals concerned and the building owner/applicant.
          marked: true
          whereToSecure: null
        - item: 13. 4 sets of complete Drawing Plans
          marked: true
          whereToSecure: null
        - item: >-

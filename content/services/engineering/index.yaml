            hazards: Soil Boring Test Result and Report with design bearing capacity as well as
            results of tests, originally signed and sealed by duly licensed and registered
            Civil/Geotechnical Engineer and Building Owner
          marked: true
          whereToSecure: Civil/Geotechnical Engineer
        - item: 10. Photocopy of PRC ID and Latest PTR of all Signing Professionals
          marked: true
          whereToSecure: Concerned Licensed and Registered Professionals
        - item: '11. Long Folder (2 pcs) For Standard Building/Structure:'

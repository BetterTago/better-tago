            Structural Analysis and Design with Foundation and Seismic Analysis that conforms to the
            latest National Structural Code of the Philippines (NSCP), and must be originally signed
            and sealed by duly licensed and registered Structural or Civil Engineer and the Building
            Owner
          marked: true
          whereToSecure: Structural or Civil Engineer
        - item: >-

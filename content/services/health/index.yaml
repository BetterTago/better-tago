      typeOfTransaction: Simple
      requirements:
        - item: 'For purposes of travel abroad: Payment for HTS'
          marked: false
          whereToSecure: Revenue Collecting Officer at CHO
      requirementSources: []
      steps:
        - clientStep: >-
            1. Proceed directly to HIV testing room, first come first serve basis. 1.1 Release order
            of payment (for purpose of travel abroad)
          agencyAction: HIV Counselor
          fee: None
          processingTime: 10 Minutes
          personResponsible: null
        - clientStep: >-
            1.2 Let the client fill-up the form, do history taking and pretest counseling with HIV
            101
          agencyAction: null
          fee: null
          processingTime: null
          personResponsible: null
        - clientStep: 2. Receive payment and release official result
          agencyAction: null
          fee: None
          processingTime: 15 Minutes
          personResponsible: null
        - clientStep: >-
            2. If purpose of transaction is for travel abroad, receive order of payment and proceed
            to Revenue Collecting Officer’s station.
          agencyAction: Revenue Collecting Officer
          fee: null
          processingTime: null
          personResponsible: null
        - clientStep: 3. Proceed to the laboratory station 3.1 Blood extraction through finger pricking
          agencyAction: HIV Proficient Medtech/ CBS Motivator
          fee: None
          processingTime: 30 Minutes
          personResponsible: null
        - clientStep: 3.2 Release result
          agencyAction: null
          fee: null
          processingTime: null
          personResponsible: null
        - clientStep: 4. Post-test counseling 4.1 Do post-test counseling
          agencyAction: HIV Counselor
          fee: None
          processingTime: 20 Minutes
          personResponsible: null
        - clientStep: 5. If the result is reactive, proceed to laboratory for another extraction of blood
          agencyAction: 5. Do extraction of blood and retesting through whole blood and serum
          fee: None
          processingTime: 1 Hour
          personResponsible: HIV Proficient Medical Technologist
        - clientStep: 6. Proceed back to HIV testing room for recounseling
          agencyAction: >-
            6. Assessment of Suicidal ideation and tendencies to harm self and assess eagerness to
            be treated
          fee: None
          processingTime: 30 Minutes
          personResponsible: HIV Counselor
        - clientStep: 7. Referred to Red Star Clinic – Davao Regional Medical Center

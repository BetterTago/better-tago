      eligibility: General Public including existing employees
      classification: Simple
      typeOfTransaction: G2G – Government to Government, G2C – Government to Citizens
      requirements:
        - item: 1. Application Letter
          marked: true
          whereToSecure: Applicant
        - item: 2. Resume/Personal Data Sheet
          marked: true
          whereToSecure: Applicant
        - item: 3. Photocopy of TOR
          marked: true
          whereToSecure: Applicant
        - item: 4. Latest Performance Rating (if there is any)
          marked: true
          whereToSecure: Applicant
        - item: 5. Photocopy of the Eligibility or PRC
          marked: true
          whereToSecure: Applicant
        - item: >-
            6. Photocopies of the trainings attended related to the job applied for (if there is
            any)
          marked: true
          whereToSecure: Applicant
        - item: >-
            7. Certification from the previous employer of the experience related to the job applied
            for (if there is any)
          marked: true
          whereToSecure: Previous employer
      requirementSources: []
      steps:
        - clientStep: 1. Submits application documents.
          agencyAction: 1.1 Entertain client’s request
          fee: None
          processingTime: 1 minute
          personResponsible: HRMA/Administrative Aide I
        - clientStep: null
          agencyAction: >-
            1.2 Conducts initial interview for knowing your client purposes and informs the
            applicant of the status of any vacancy or none and the possible schedule of the HRM PSB
          fee: None
          processingTime: 5 minutes
          personResponsible: HRMO/HRMA
        - clientStep: null
          agencyAction: >-
            1.3 Records the application as one of the potential pool of candidates in the vacancy or
            future vacancies
          fee: None
          processingTime: 2 Minutes
          personResponsible: HRMA
        - clientStep: null
          agencyAction: 'TOTAL:'
          fee: None
          processingTime: 8 minutes
          personResponsible: null

    charterTitle: Issuance of Appointment
    charterTitleSource: extracted
    group: null
    ambiguity: null
    verificationRecord: null
    transcriptionNote: null
    content:
      eligibility: General Public including Existing Employees
      classification: Simple
      typeOfTransaction: G2G – Government to Government, G2C – Government to Citizen
      requirements:
        - item: REGULAR APPOINTMENT
          marked: false
          whereToSecure: null
        - item: 1. Personal Data Sheet (PDS) (CS Form No. 212, Revised 2017)
          marked: true
          whereToSecure: null
        - item: >-
            2. Original copy of the authenticated certificate of eligibility/rating/license for
            original appointment, promotion, transfer, reappointment (change of status to permanent)
            or reemployment
          marked: true
          whereToSecure: null
        - item: 3. Appointee with decided Administrative/Criminal Case
          marked: true
          whereToSecure: null
        - item: >-
            4. Medical Certificate (CS Form No. 211, Revised 2018) which states that the appointee
            is fit for employment
          marked: true
          whereToSecure: null
        - item: 5. Certificate of Live Birth
          marked: true
          whereToSecure: null
        - item: 6. Marriage Contract/Certificate for married employees
          marked: true
          whereToSecure: null
        - item: '7. Clearances: Valid NBI clearance for original and reemployment'
          marked: true
          whereToSecure: NBI
        - item: >-
            8. Clearance from money, property and work-related accountabilities from the appointee’s
            former office (CS Form No. 7, Revised 2018)
          marked: true
          whereToSecure: Previous office/employment
        - item: >-
            9. Performance Rating of the appointee in the last rating period for appointment by
            promotion or transfer
          marked: true
          whereToSecure: Previous office/employment
        - item: >-
            10. Scholastic Record/Academic Record: Certified Authenticated Verified Transcript of
            Records (TOR) and Diploma
          marked: true
          whereToSecure: CHED/SUCs
        - item: >-
            11. Service Records or Certification of the previous employer through its Human Resource
            Office of the related experience acquired (when required in the vacant position’s
            Qualification Standard)
          marked: true
          whereToSecure: Previous office/employment
        - item: >-
            12. Original Certificate of Completion/Attendance or Certified True of the same
            Certificate of the trainings successfully attended (when required in the vacant
            position’s Qualification Standard)
          marked: true
          whereToSecure: Principal owner
      requirementSources:
        - Download from the CSC website
        - '1. Certificate of Eligibility issued by: CSC, NAPOLCOM, CESB'
        - >-
          2. Valid professional license issued by: PRC/Supreme Court/ MARINA for positions involving
          practice of profession
        - >-
          3. Professional license or Certificate of Registration or Report of Rating issued by
          PRC/SC/MARINA for positions not involving practice of profession
        - >-
          4. Valid licenses issued by authorized regulatory agencies such as NTC/CAAP/LTO/PNP
          Certified true copy of the decision issued by the office/court/tribunal; or The
          appointment by promotion of an employee who had been found guilty in an administrative
          case for which a penalty of suspension or fine was imposed. Licensed government physician
          PSA or the LCR of the municipality/city PSA or the LCR of the municipality/city
      steps:
        - clientStep: 1. Submits all requirements.
          agencyAction: >-
            1.1 Entertain applicants documents, evaluates and informs the applicant if there is any
            lacking documents or discrepancies
          fee: None
          processingTime: 1 hour
          personResponsible: HRMO/HRMA/Administrative Aide I
        - clientStep: null
          agencyAction: 1.2 If completely complied with, proceed to documenting
          fee: None
          processingTime: 3 days
          personResponsible: HRMO/HRMA/Admin Aide
        - clientStep: null
          agencyAction: everything necessary in the appointment.
          fee: null
          processingTime: null
          personResponsible: null
        - clientStep: null
          agencyAction: 1.3 Approves the appointment documents
          fee: None
          processingTime: 1 day
          personResponsible: Appointing Authority/LCE, Municipal Accountant, HRMO and Department Head
        - clientStep: 2. Go back to the HRM Office
          agencyAction: 2.1 Signs all appointment documents and the like
          fee: None
          processingTime: 30 minutes
          personResponsible: HRMA/Admin Aide
        - clientStep: 3. Take an Oath of Office
          agencyAction: 3.1 Officiate the oath of office of the newly appointed employee
          fee: None
          processingTime: 30 Minutes
          personResponsible: Appointing Authority/Local Chief Executive
        - clientStep: null
          agencyAction: 'TOTAL:'
          fee: None
          processingTime: 4 days and 2 hours
          personResponsible: null
      totalFee: >-
        Upon instruction of the Appointing Authority/Local Chief Executive to proceed with the
